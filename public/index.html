<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Libro de Visitas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    form { display: grid; gap: 10px; padding: 16px; border: 1px solid #ddd; border-radius: 10px; }
    input, textarea, button { font: inherit; padding: 10px; }
    textarea { min-height: 110px; resize: vertical; }
    .error { background: #ffe9e9; padding: 10px; border: 1px solid #ffb3b3; border-radius: 8px; margin: 12px 0; display:none; }
    .lista-mensajes { margin-top: 18px; padding-left: 18px; }
    .mensaje { margin: 10px 0; }
    .meta { font-size: 12px; opacity: .75; }
  </style>
</head>
<body>
  <h1>📖 Libro de Visitas</h1>

  <div id="error" class="error">⚠️ Debes completar nombre y mensaje.</div>

  <form method="POST" action="/nuevo-mensaje">
    <input type="text" name="usuario" placeholder="Tu nombre" required />
    <textarea name="mensaje" placeholder="Escribe tu mensaje..." required></textarea>
    <button type="submit">Enviar</button>
  </form>

  <h2>Mensajes</h2>
  <!-- MENSAJES_AQUI -->

  <script>
    // Muestra un error simple si vienes con ?error=1
    const params = new URLSearchParams(location.search);
    if (params.get("error") === "1") {
      document.getElementById("error").style.display = "block";
    }
  </script>
</body>
</html>
